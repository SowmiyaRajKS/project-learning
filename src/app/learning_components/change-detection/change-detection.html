<h2>Change Detection</h2>

<div class="row">
    <div class="col-3">{{ productName }} - {{ productPrice() }}</div>
    <div class="col-3" >
        <input type="text" name="productName" [(ngModel)]="productName">
    </div>
    <div class="col-3">
        <button (click)="changeProduct()">Change Product</button>
    </div>
</div>
