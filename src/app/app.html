<input type="text" name="userName" [(ngModel)]="userName" placeholder="Enter your name"/>

<h3>Welcome, {{userName()}}</h3>

<app-databinding [userNameValue]="userName()" (submitted)="onSubmitted($event)"></app-databinding>

@if(this.isSubmitted()){
  <h4> Calculation successfull - {{sumValue()}}</h4>
}

<app-contentprojection>
  <div row1_col1>
    This is for Row 1 Col 1
  </div>
  <div row1_col2>
    This is for Row 1 Col 2
  </div>
</app-contentprojection>
